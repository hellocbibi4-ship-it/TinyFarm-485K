<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyFarm - Achat animaux</title>
    <link rel="stylesheet" href="css/achat-animaux.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=ADLaM+Display&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Arrière-plan volontairement flou pour donner l'effet "popup par-dessus la ferme" -->
    <div class="fond-flou" aria-hidden="true"></div>

    <main class="zone-principale">
        <!-- Popup principale qui sera intégrée ensuite dans la page d'accueil -->
        <section id="popup-achat" class="popup-achat" role="dialog" aria-modal="true" aria-labelledby="titre-popup">
            <header class="entete-bois">
                <h1 id="titre-popup">Achat animaux</h1>
            </header>

            <p class="ligne-solde">Solde : <span id="solde-ecus">120</span> <span class="piece" aria-hidden="true"></span></p>

            <section class="grille-animaux" aria-label="Animaux disponibles">
                <article class="carte-animal">
                    <h2>Vache</h2>
                    <div class="zone-image">
                        <span
                            role="img"
                            aria-label="Illustration d'une vache"
                            class="image-animal image-vache"
                        ></span>
                    </div>
                    <p class="prix">50 <span class="piece" aria-hidden="true"></span></p>
                    <button class="btn-acheter" type="button" data-animal="vache">Acheter</button>
                </article>

                <article class="carte-animal">
                    <h2>Poule</h2>
                    <div class="zone-image">
                        <span
                            role="img"
                            aria-label="Illustration d'une poule"
                            class="image-animal image-poule"
                        ></span>
                    </div>
                    <p class="prix">10 <span class="piece" aria-hidden="true"></span></p>
                    <button class="btn-acheter" type="button" data-animal="poule">Acheter</button>
                </article>

                <article class="carte-animal">
                    <h2>Lapin</h2>
                    <div class="zone-image">
                        <span
                            role="img"
                            aria-label="Illustration d'un lapin"
                            class="image-animal image-lapin"
                        ></span>
                    </div>
                    <p class="prix">10 <span class="piece" aria-hidden="true"></span></p>
                    <button class="btn-acheter" type="button" data-animal="lapin">Acheter</button>
                </article>
            </section>

            <footer class="zone-actions">
                <button id="bouton-fermer" class="btn-fermer" type="button">Fermer</button>
            </footer>
        </section>

        <!-- Bouton visible uniquement quand la popup est fermée -->
        <button id="bouton-ouvrir" class="btn-ouvrir cache" type="button">Ouvrir la boutique</button>

        <!-- Zone de debug/test: pratique pendant l'intégration, peut être retirée ensuite -->
        <section class="resume-achats" aria-label="Résumé des achats de test">
            <h2>Résumé des achats</h2>
            <p>Vaches : <span id="compteur-vache">0</span></p>
            <p>Poules : <span id="compteur-poule">0</span></p>
            <p>Lapins : <span id="compteur-lapin">0</span></p>
        </section>

        <!-- Message d'état dynamique (succès/erreur) annoncé aussi aux lecteurs d'écran -->
        <p id="message-action" class="message-action" aria-live="polite"></p>
    </main>

    <script src="js/achat-animaux.js"></script>
</body>
</html>
